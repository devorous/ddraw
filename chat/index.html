<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DDraw Chat</title>
    <link rel="icon" href="/images/pepper.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/fonts/fluentmoji-color/FluentEmojiColor.css">

    <script>
      (() => {
        const isDesktop = typeof window !== 'undefined' && !!(window.__TAURI_INTERNALS__ || window.__TAURI_METADATA__);
        if (isDesktop) {
          document.documentElement.dataset.desktopApp = 'true';
        }
      })();
    </script>

    <style>
      html, body, #app {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        overflow: hidden;
        background: #0f1117;
        font-family: 'Inter', sans-serif;
      }

      html[data-desktop-app='true'] {
        --desktop-titlebar-height: 26px;
      }
      html[data-desktop-app='true'] body {
        padding-top: var(--desktop-titlebar-height);
      }
      #desktopTitlebarMount {
        display: none;
      }
      html[data-desktop-app='true'] #desktopTitlebarMount {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 1000000;
        display: block;
        height: var(--desktop-titlebar-height);
      }
      .desktop-titlebar-fallback {
        box-sizing: border-box;
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
        height: 100%;
        padding: 0 0 0 0.3rem;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        background: linear-gradient(180deg, rgba(48, 54, 68, 0.98) 0%, rgba(40, 45, 57, 0.96) 100%);
        cursor: default;
        -webkit-user-select: none;
        user-select: none;
      }
      .desktop-titlebar-fallback,
      .desktop-titlebar-fallback * {
        -webkit-user-select: none;
        user-select: none;
      }
      .desktop-titlebar-fallback .titlebar-actions {
        display: flex;
        gap: 0;
        height: 100%;
        align-items: stretch;
      }
      .desktop-titlebar-fallback .titlebar-btn {
        display: grid;
        place-items: center;
        width: 28px;
        min-width: 28px;
        height: 100%;
        margin: 0;
        padding: 0;
        border: 0;
        border-radius: 0;
        background: color-mix(in srgb, rgba(48, 54, 68, 0.98) 82%, transparent);
        color: #f0f2f5;
        cursor: pointer;
        transition: background 0.18s ease, color 0.18s ease, transform 0.18s ease;
      }
      .desktop-titlebar-fallback .titlebar-btn:hover {
        background: color-mix(in srgb, #00d4aa 18%, rgba(48, 54, 68, 0.98));
        color: #ffffff;
        transform: translateY(-1px);
      }
      .desktop-titlebar-fallback .titlebar-btn.close:hover {
        background: color-mix(in srgb, #ff6b6b 24%, rgba(48, 54, 68, 0.98));
      }
      .desktop-titlebar-fallback .brand {
        margin: 0;
        font-family: 'Fredoka', sans-serif;
        font-size: 1.2rem;
        font-weight: 700;
        color: #00d4aa;
        letter-spacing: 0.01em;
        line-height: 0.92;
        transform: translateY(2px) rotate(-2deg);
        transform-origin: left center;
      }
      .desktop-titlebar-fallback .window-icon {
        position: relative;
        display: block;
        width: 14px;
        height: 14px;
        color: currentColor;
      }
      .desktop-titlebar-fallback .window-icon::before,
      .desktop-titlebar-fallback .window-icon::after {
        content: '';
        position: absolute;
        box-sizing: border-box;
      }
      .desktop-titlebar-fallback .minimize-icon::before {
        left: 1px;
        right: 1px;
        bottom: 4px;
        border-top: 2px solid currentColor;
      }
      .desktop-titlebar-fallback .maximize-icon::before {
        inset: 2px 1px 2px 1px;
        border: 1.8px solid currentColor;
        border-top-width: 2.6px;
        border-radius: 1px;
      }
      #desktopTitlebarMount[data-maximized='true'] .desktop-titlebar-fallback .maximize-icon::before {
        inset: 4px 1px 1px 4px;
        border: 1.8px solid currentColor;
        border-top-width: 2.4px;
        border-radius: 1px;
      }
      #desktopTitlebarMount[data-maximized='true'] .desktop-titlebar-fallback .maximize-icon::after {
        inset: 1px 4px 4px 1px;
        border: 1.8px solid currentColor;
        border-top-width: 2.4px;
        border-radius: 1px;
        background: color-mix(in srgb, rgba(48, 54, 68, 0.98) 82%, transparent);
      }
      .desktop-titlebar-fallback .fullscreen-icon::before {
        top: 1px;
        right: 1px;
        width: 6px;
        height: 6px;
        border-top: 2px solid currentColor;
        border-right: 2px solid currentColor;
      }
      .desktop-titlebar-fallback .fullscreen-icon::after {
        left: 1px;
        bottom: 1px;
        width: 6px;
        height: 6px;
        border-left: 2px solid currentColor;
        border-bottom: 2px solid currentColor;
      }
      .desktop-titlebar-fallback .fullscreen-icon {
        box-shadow: 8px -8px 0 -6px currentColor, -8px 8px 0 -6px currentColor;
      }
      .desktop-titlebar-fallback .close-glyph {
        font-size: 1.45rem;
        font-weight: 500;
        line-height: 1;
      }
    </style>

    <style id="rank-styles">
      .rank-guest {
        color: var(--role-guest);
      }
      .rank-user {
        color: var(--role-user);
      }
      .rank-helper {
        color: var(--role-helper);
        font-weight: 500;
      }
      .rank-mod {
        color: var(--role-mod);
        font-weight: 600;
      }
      .rank-admin {
        color: var(--role-admin);
        font-weight: 600;
        text-shadow: 0 0 4px color-mix(in srgb, var(--role-admin), transparent 70%);
      }
      .rank-noble {
        color: var(--role-noble);
        font-weight: 700;
        text-shadow: 0 0 8px color-mix(in srgb, var(--role-noble), transparent 40%);
      }
      .rank-holy {
        color: var(--role-holy);
        font-weight: 700;
        text-shadow: 0 0 10px color-mix(in srgb, var(--role-holy), transparent 30%);
      }
      .rank-deity {
        color: var(--role-deity);
        font-weight: 700;
        text-shadow: 0 0 12px color-mix(in srgb, var(--role-deity), transparent 50%);
      }
    </style>
  </head>
  <body>
    <div id="desktopTitlebarMount">
      <div class="desktop-titlebar-fallback">
        <p class="brand">Chat</p>
        <div class="titlebar-actions">
          <button class="titlebar-btn" data-window-action="minimize" title="Minimize window" type="button" aria-label="Minimize">
            <span class="window-icon minimize-icon" aria-hidden="true"></span>
          </button>
          <button class="titlebar-btn" data-window-action="maximize" title="Maximize window" type="button" aria-label="Maximize window">
            <span class="window-icon maximize-icon" aria-hidden="true"></span>
          </button>
          <button class="titlebar-btn" data-window-action="fullscreen" title="Enter fullscreen" type="button" aria-label="Enter fullscreen">
            <span class="window-icon fullscreen-icon" aria-hidden="true"></span>
          </button>
          <button class="titlebar-btn close" data-window-action="close" title="Close window" type="button" aria-label="Close window">
            <span class="close-glyph" aria-hidden="true">&times;</span>
          </button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/platform/earlyDesktopChrome.js"></script>

    <div id="app"></div>
    <script type="module" src="/src/chat-popout/main.js"></script>
  </body>
</html>
