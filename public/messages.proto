syntax = "proto3";

// Optimized message format for minimal wire size
// Field numbers 1-15 use 1-byte tags (most frequent fields go here)
message Msg {
  // Combined command + broadcast type enum
  enum T {
    // Retired types. Never reuse these numbers — an old client still has them
    // in its schema and would decode a new message under the old meaning.
    //   42  SYNC_PROVIDE                 legacy provider-election sync relay,
    //   43  SYNC_CANVAS                  replaced by SyncCoordinator
    //  104  BOARD_SNAPSHOT_JOIN_NOTIFY   opt-in join toast, replaced by auto-restore
    //  133  METRICS_UPDATE               never sent; MetricsTracker uses HTTP
    //  140  SYNC_PARITY_MANIFEST         manifest rides on SYNC_PARITY_MISMATCH
    reserved 42, 43, 104, 133, 140;

    // Commands (0-9)
    CONNECT = 0;
    USERS = 1;          // Current users list
    SETTINGS = 2;       // Board settings
    LEFT = 3;           // User left

    // Broadcast types (10+) - ordered by frequency
    MM = 10;            // Mouse move (Path-based batching)
    MD = 11;            // Mouse down
    MU = 12;            // Mouse up
    CP = 13;            // Change pressure
    CS = 14;            // Change size
    CT = 15;            // Change tool
    CC = 16;            // Change color
    CSP = 17;           // Change spacing
    CN = 18;            // Change name
    KP = 19;            // Key press
    CLR = 20;           // Clear canvas
    MIR = 21;           // Toggle mirror
    MSG = 22;           // Chat message
    GMP = 23;           // Image brush (GIMP brushes and standard images)
    AFK = 24;           // AFK status change
    PAN = 25;           // Pan mode
    CANCEL = 26;        // Cancel current stroke
    HIDE_CURSOR = 27;   // Hide user's cursor
    SHOW_CURSOR = 28;   // Show user's cursor
    CSM = 29;           // Change smoothing
    CHD = 45;           // Change hardness
    SEL_LIFT = 30;
    SEL_MOVE = 31;
    SEL_COMMIT = 32;
    SEL_DELETE = 33;    // Delete selection
    SEL_FILL = 34;      // Fill selection with color
    SEL_STAMP = 35;     // Stamp selection
    SEL_CANCEL = 36;    // Cancel selection movement
    SEL_TO_BRUSH = 37;  // Convert selection to brush
    IMG_PASTE = 38;     // Paste image data (selection paste, image upload)
    DM = 39;            // Direct message
    CHAT_IMG = 40;      // Chat image message

    // Sync types (41+)
    SYNC_REQUEST = 41;      // New user requests canvas state
    SYNC_COMPLETE = 44;     // Sync complete
    SYNC_LAYER_BASE = 46;   // One per layer: baked base canvas PNG
    SYNC_STROKE = 47;       // One per stroke record (stack or redo)
    SYNC_STROKES_DONE = 48; // All stroke data sent; triggers SYNC_COMPLETE
    SYNC_METADATA = 49;     // Sync metadata (total message count)

    // Auth & Moderation (50+)
    AUTH_REGISTER = 50;  // Register new account
    AUTH_LOGIN    = 51;  // Login with credentials or token
    AUTH_RESULT   = 52;  // Auth response (success/failure)
    MOD_ACTION    = 53;  // Moderator action (kick/mute/ban/unmute/unban)
    MOD_RESULT    = 54;  // Moderation action result
    MOD_NOTIFY    = 55;  // Moderation notification broadcast
    MOD_LIST      = 56;  // Active moderation entries list
    CBR           = 57;  // Change blur radius
    CL            = 58;  // Change active layer
    CBM                = 59;  // Change blend mode
    UNDO               = 60;  // Undo last stroke for user
    REDO               = 61;  // Redo last undone stroke for user
    SYNC_STROKE_BATCH  = 62;  // Batch of strokes per layer (efficient sync)
    ROOM_LIST_REQUEST  = 63;  // Request list of rooms
    ROOM_LIST_RESPONSE = 64;  // Response with room list
    MOD_WIPE           = 65;  // Wipe all strokes from a user (mod action)
    ROOM_UPDATE        = 66;  // Update room settings (owner/mod only)
    SEL_FLIP           = 67;  // Flip selection horizontally
    SEL_PENDING        = 68;  // Pending selection (marquee only)
    PING               = 69;
    PONG               = 70;
    CTHN               = 71;  // Change thinning
    CSIM               = 72;  // Change simulate pressure
    FILL               = 73;  // Flood fill at position
    ROOM_ROLE_SET      = 74;  // Set a user's room-specific role
    SYNC_TILE_OWNERSHIP = 75; // Tile ownership data (initial sync + real-time updates)
    TILE_UPDATE        = 76;  // Real-time tile ownership update (broadcast)
    TILE_CLEAR         = 77;  // Tiles that are now empty (ownership should be cleared)
    ROOM_REGISTER      = 78;  // Claim ownership of an unclaimed room
    ROOM_UNREGISTER    = 79;  // Release ownership of a room (owner/deity only)
    ROOM_OWNERSHIP     = 80;  // Broadcast room ownership change
    MOD_UNDO_TO_STATE  = 81;  // UNDO board to a specific timestamp
    GPT                = 82;  // Pattern brush (GIMP Pattern Tool)
    GLITCH_RESULT      = 83;  // Glitch blur result image (sender-computed, for deterministic sync)
    CPM                = 84;  // Change pattern mode (fill/select pattern toggle)
    ROOM_PREVIEW       = 85;  // Room canvas preview (1/4 scale thumbnail)
    MIRROR_REGION      = 86;  // Create/update mirror regions
    ROOM_ROLE_LIST_REQUEST = 87;  // Request room moderation roster
    ROOM_ROLE_LIST_RESPONSE = 88; // Response with room moderation roster
    GLOBAL_ROLE_SET = 89;          // Set a user's global role (DEITY only)
    TEXT_APPLY = 90;               // Apply text with explicit content and render state
    TEXT_REMOVE = 95;              // Remove an active SVG text record (eraser bake or expiry)
    CSDM = 91;                     // Change shape draw mode
    GLOBAL_MESSAGE = 92;           // Holy/Deity global toast or server update notice
    SEL_MASK = 93;                 // Toggle selection mask mode
    OBSCURE_REGION = 94;           // Add a revealable blurred region overlay
    CF = 116;                      // Change font
    BOARD_SNAPSHOT_SAVE = 96;
    BOARD_SNAPSHOT_LIST_REQUEST = 97;
    BOARD_SNAPSHOT_LIST_RESPONSE = 98;
    BOARD_SNAPSHOT_RESTORE = 99;
    BOARD_SNAPSHOT_DELETE = 100;
    BOARD_SNAPSHOT_REQUEST = 101; // Server asks a client to capture a snapshot
    BOARD_SNAPSHOT_GET = 102;     // Client privately fetches one snapshot's layer data
    BOARD_SNAPSHOT_REGION_RESTORE = 103; // Restore a region from a snapshot (broadcast)
    CHECKPOINT_UPLOAD = 110;       // Dedicated user uploads full board checkpoint
    CHECKPOINT_LIST = 111;         // Request list of checkpoints for replay
    CHECKPOINT_LIST_RESPONSE = 112; // Response with checkpoint metadata
    CHECKPOINT_GET = 113;          // Request a specific checkpoint image
    REPLAY_REQUEST = 114;          // Request replay data (checkpoint + deltas) for time range
    REPLAY_RESPONSE = 115;         // Response with replay data
    CHAT_REACTION = 117;           // Chat reaction toggle
    STAFF_MSG = 118;               // Staff-only chat message
    STAFF_CHAT_IMG = 119;          // Staff-only chat image
    FLOATING_ART_UPDATE = 120;     // Floating art (gallery image with 2+ likes)
    BW_PROBE_START = 130;          // Server→client: start a bandwidth probe (returns N chunks)
    BW_PROBE_CHUNK = 131;          // Client→server: one probe chunk (random bytes)
    BW_REPORT = 132;               // Client→server: report a previously measured uploadBps (e.g. from _discovery)
    IMAGE_TOOL = 134;              // Image data for image-based tools (image/pattern/confetti)
    CONNECT_RESUMED = 135;         // Server→client: same-session reattach after a brief disconnect
    SEL_MERGE = 136;               // Merge selection contents between layers (up/down/all)
    SYNC_PARITY_CHECK = 137;       // Client→server: heartbeat (seq, count, rollingHash)
    SYNC_PARITY_OK = 138;          // Server→client: client matches server log
    SYNC_PARITY_MISMATCH = 139;    // Server→client: counts/hashes diverged
    SYNC_PARITY_CHUNK_REQUEST = 141; // Client→server: request entries for a chunk index
    SYNC_PARITY_CHUNK = 142;       // Server→client: full fingerprint entries for a chunk
    SYNC_PARITY_RESYNC_REQUEST = 143; // Client→server: replay these missing seqs
    SYNC_PARITY_MISMATCH_REPORT = 144; // Client→server: post-diff detail for persistence
    SYNC_CHECKPOINT_MINTED = 145;  // Server→client: a checkpoint was minted at snapshot_seq; truncate the fingerprint log before it (shared baseSeq watermark)
    SET_BADGE = 146;               // Client→server: change the user's selected cosmetic badge
    // Background history backfill. After SYNC_COMPLETE the server streams the
    // ~2 minutes of drawing a joiner missed so their rolling DVR tape ("History
    // → Recent") starts populated rather than blank. BEGIN carries the base
    // checkpoint image, CHUNK carries batches of the original wire frames, END
    // closes the stream. These are tape material only — the client must never
    // apply them to the live board. See server/RoomHistory.js.
    HISTORY_BACKFILL_BEGIN = 147;
    HISTORY_BACKFILL_CHUNK = 148;
    HISTORY_BACKFILL_END = 149;
    // Room start state: which snapshot an empty room comes back up on.
    ROOM_START_SNAPSHOT_GET = 150;  // Client->server: what is the room's start state?
    ROOM_START_SNAPSHOT_INFO = 151; // Server->client: room_start_snapshot_state + snapshot_list[0]
    ROOM_START_SNAPSHOT_SET = 152;  // Client->server: pin snapshot_id (empty = clear the pin)
    SEL_HIDE = 153;                 // Hide/show the sender's selection outline on other clients' boards (e.g. while the save dialog is open)
  }

  // Tool enum
  enum Tool {
    BRUSH = 0;
    TEXT = 1;
    ERASE = 2;
    IMAGE_BRUSH = 3;
    SELECT = 4;
    PEN = 5;
    LINE = 6;
    RECTANGLE = 7;
    CIRCLE = 8;
    INK = 9;
    INKDROPPER = 10;
    BLUR = 11;
    CIRCLE_BLUR = 12;
    GLITCH_BLUR = 13;
    PIXEL = 14;
    FLOODFILL = 15;
    PATTERN = 16;
    CONFETTI = 17;
  }

  // === High-frequency fields (1-15 = 1-byte tags) ===
  T t = 1;              // Message type
  uint32 u = 2;         // User session index (0-255)
  
  // Packed repeated field for multiple points per tick.
  // Wire format: quantized to 0.1px (values are floor(coord * 10)), delta-encoded
  // within each message. First pair (ps[0], ps[1]) is absolute; subsequent pairs
  // are deltas from the previous reconstructed point. sint32 (ZigZag) keeps small
  // deltas in 1 byte. Deltas reset at each message — packets are self-contained.
  repeated sint32 ps = 3;

  uint32 p = 4;         // Pressure * 100 (0-100)
  int32 s = 5;          // Size * 100 (allows 0.01 precision) — signed for fill shrink
  Tool l = 6;           // Tool (l for "tool")
  fixed32 c = 7;        // Color as packed RGBA (4 bytes fixed)
  bool a = 8;           // AFK status / boolean flags
  bool m = 9;           // Mirror status
  string k = 10;        // Key pressed
  string n = 11;        // Name
  string g = 12;        // Chat message or tool payload data (JSON)
  repeated float rs = 13; // Stamp metadata per point pair in ps: radii for pen/blur, deterministic seeds for confetti

  // === Lower-frequency fields (16+ = 2-byte tags) ===
  uint32 sp = 16;       // Spacing * 100
  uint32 sm = 23;       // Smoothing (integer 0-50, raw slider value)
  uint32 hd = 28;       // Hardness * 100 (0.0-1.0 range becomes 0-100)
  uint32 br = 43;       // Blur radius * 100
  uint32 ly = 44;       // Active layer index
  string bm = 45;       // Blend mode (e.g., 'source-over', 'multiply')
  string bbm = 74;      // Blend bake mode: 'existing' or 'background'

  // User list for USERS message
  message U {
    uint32 u = 1;       // User index
    bool a = 2;         // AFK
    float x = 3;       // Last known X
    float y = 4;       // Last known Y
    Tool l = 5;         // Tool
    fixed32 c = 6;      // Color packed
    uint32 s = 7;       // Size * 100
    uint32 sp = 8;      // Spacing * 100
    uint32 p = 9;       // Pressure * 100
    string n = 10;      // Name
    string tx = 11;     // Current text
    uint32 sm = 12;     // Smoothing (integer 0-50, raw slider value)
    uint32 hd = 13;     // Hardness * 100 (0.0-1.0 range becomes 0-100)
    uint32 role = 14;   // 0=guest,1=user,2=mod,3=admin
    bool ch = 15;       // Cursor hidden
    uint32 br = 16;     // Blur radius * 100
    uint32 ly = 17;     // Active layer index
    string bm = 18;     // Blend mode
    string ib = 19;     // Image brush data (JSON)
    string iph = 20;    // Obfuscated IP hash for grouping
    uint32 th = 21;     // Thinning * 100
    uint32 sim = 22;    // Simulate pressure (0 or 1)
    string pb = 23;     // Pattern brush data (JSON)
    bool   pm = 24;     // Pattern mode enabled
    string rn = 25;     // Registered name (original, without dedup suffix)
    bool mt = 26;       // Whether the user is currently muted
    string fo = 27;     // Current text font family
    float tm = 28;      // Text baseline multiplier
    float to = 29;      // Text baseline offset
    string vip = 30;    // Viewer-specific visible IP (role-gated by server)
    string iid = 31;    // Instance ID: random per-connection token to detect index reuse
    string bbm = 32;    // Blend bake mode: 'existing' or 'background'
    bool ea = 33;       // Eraser applies to all layers
    bool hdsc = 34;     // Whether this account is linked to Discord
    uint32 globalRole = 35; // Account/global role, including Noble/Holy/Deity
    uint32 roomRole = 36;   // Room-specific role for this room
    string bdg = 37;        // Selected cosmetic badge id (e.g. 'flock', 'pepper')
    bool sup = 38;          // Whether this user is an active supporter (gold cosmetics)
    string ctry = 39;       // ISO 3166-1 alpha-2 country code derived from IP geolocation
    bool sb = 40;           // Shadow-banned (MOD+ viewers only; never sent true on the subject's own row)
  }
  repeated U us = 17;   // Users array

  // === Selection Fields (18-22) ===
  int32 sx = 18;        // Selection X
  int32 sy = 19;        // Selection Y
  int32 sw = 20;        // Selection Width
  int32 sh = 21;        // Selection Height
  repeated float cr = 22; // Selection control region/points
  repeated float cb = 154; // Selection source crop [x, y, width, height] for current source
  repeated float cbt = 155; // Cumulative selection source crop for sync replay
  uint32 board_width = 156; // Board width in pixels for sync/snapshot sizing
  uint32 board_height = 157; // Board height in pixels for sync/snapshot sizing
  bool room_obscure_requires_registered = 158; // ROOM_UPDATE/SETTINGS: only registered users can reveal obscure regions

  // === Sync Fields ===
  bytes img = 24;            // PNG image data (full canvas or stroke/base canvas)
  uint32 tu = 25;            // Target user for sync/active-stroke replay messages

  // === Stroke Sync Fields ===
  uint64 stroke_ts = 46;       // Stroke timestamp (Date.now()) for undo grouping
  bool stroke_redo = 47;       // true = belongs to redo stack, false = strokeStack
  uint32 stroke_redo_batch = 48; // Redo batch index (oldest batch = 0)
  uint32 sync_total = 49;      // Total number of sync messages that will be sent

  // === DM Field ===
  uint32 r = 26;             // Recipient user ID for direct messages

  // === Chat Image Field ===
  bytes cimg = 27;           // Chat image data (raw image bytes)

  // === Auth Fields (29-33, 63-65) ===
  string auth_username  = 29;  // Username for register/login
  string auth_password  = 30;  // Password for register/login
  string auth_token     = 31;  // JWT token (login with token, or returned in AUTH_RESULT)
  string auth_error     = 32;  // Error message in AUTH_RESULT
  uint32 auth_role      = 33;  // Role in AUTH_RESULT: 0=guest, 1=user, 2=mod, 3=admin
  string auth_email            = 63;  // Email (optional, for registration)
  string auth_secret_question  = 64;  // Secret question (for registration/recovery)
  string auth_secret_answer    = 65;  // Secret answer (hashed on server, for registration/recovery)
  bool auth_has_email          = 129; // Whether user has a verified email (for AUTH_RESULT)
  bool auth_email_prompt_declined = 130; // Whether user declined the email prompt (for AUTH_RESULT)
  bool auth_has_discord        = 161; // Whether user has a linked Discord account
  bool auth_needs_username_setup = 162; // Whether the user should pick a DDraw username
  string auth_suggested_username = 163; // Suggested username for setup flows
  string auth_badge = 198;             // AUTH_RESULT: the user's saved selectedBadge id
  bool auth_supporter = 199;           // AUTH_RESULT: whether the account has an active supporter subscription

  // === Moderation Fields (34-42) ===
  uint32 mod_action_type  = 34;  // 0=kick, 1=mute, 2=ban, 3=unmute, 4=unban
  uint32 mod_target       = 35;  // Target session index
  string mod_reason       = 36;  // Reason for action
  uint32 mod_duration     = 37;  // Duration in minutes (0=permanent)
  string mod_target_name  = 39;  // Target username
  string mod_issuer_name  = 40;  // Issuer username
  bool   mod_show_history = 53;  // MOD_LIST: return all entries (not just active)
  string mod_search       = 54;  // MOD_LIST: filter by username prefix
  string mod_ip_scope     = 172; // MOD_ACTION: 'exact' | 'subnet' (default) | 'wide'

  // Moderation entry for active bans/mutes list
  message ModEntry {
    string id        = 1;   // DB entry ID
    uint32 type      = 2;   // 0=ban, 1=mute, 2=shadowban
    string username  = 3;
    string reason    = 4;
    string ip        = 5;   // Masked range string (e.g. "2001:db8:abcd::/64")
    string issuedBy  = 6;
    uint64 createdAt = 7;
    uint64 expiresAt = 8;   // 0=permanent
    bool   active    = 9;
    string roomId    = 10;  // Room this entry applies to (empty = global)
    string ipScope   = 11;  // CIDR scope this ban targets (e.g. "/64", "/24", "/128")
  }
  repeated ModEntry mod_entries = 42;  // List of active moderation entries

  // Stroke record for batched sync
  message StrokeRecord {
    bytes img        = 1;   // PNG blob of cropped stroke canvas
    uint32 userId    = 2;   // User who drew this stroke
    int32 x          = 3;   // X offset on canvas
    int32 y          = 4;   // Y offset on canvas
    uint32 width     = 5;   // Cropped width
    uint32 height    = 6;   // Cropped height
    string blendMode = 7;   // 'source-over', 'multiply', etc.
    uint64 timestamp = 8;   // Date.now() for undo grouping
    bool isRedo      = 9;   // true = redo stack entry
    uint32 redoBatch = 10;  // Redo batch index (if isRedo)
    uint32 layerIdx  = 11;  // Layer group index (needed for redo batches with mixed layers)
    repeated uint32 affectedTiles = 12;  // Tile indices affected by this stroke (for undo/redo tile tracking)
    bool eraseAll    = 13;  // true = erase-all-layers stroke
    string blendBakeMode = 14; // 'existing' or 'background'
    bool activeStroke = 15; // true = in-progress stroke; import into activeStrokeByUser
    uint64 seq = 16;        // Global message sequence number for ordering
  }

  // === Batched Sync Fields ===
  repeated StrokeRecord strokes = 50;  // Stroke batch (for SYNC_STROKE_BATCH)
  uint32 layerIdx = 51;                // Which layer group this batch belongs to

  // Room list for ROOM_LIST_RESPONSE
  message RoomInfo {
    string id          = 1;
    uint32 userCount   = 2;
    bool locked        = 3;
    bool hasPassword   = 4;
    string description = 5;
    string ownerId     = 6;
    string ownerUsername = 7;
    bytes preview      = 8;   // 1/4 scale PNG preview of canvas
  }
  repeated RoomInfo rooms = 52;

  // === Room Settings Fields (55-58) ===
  string room_description = 55;  // ROOM_UPDATE: new description
  bool   room_locked      = 56;  // ROOM_UPDATE: locked state
  uint32 room_max_users   = 57;  // ROOM_UPDATE: max users (0 = unlimited)
  string room_owner_id    = 58;  // ROOM_UPDATE: owner userId (for claiming)

  // === Extended Room Settings Fields (90+) ===
  string room_background_color = 90;  // ROOM_UPDATE: canvas background color (hex "#ffffff")
  bool room_mod_inactive_immune = 91; // ROOM_UPDATE/SETTINGS: moderators ignore inactivity timeout
  string mirror_regions_json = 92;    // SETTINGS/MIRROR_REGION: shared mirror region payload
  string room_join_policy = 93;       // ROOM_UPDATE/SETTINGS: open|registered|trusted
  bool room_auto_mute_guests = 94;    // ROOM_UPDATE/SETTINGS: auto-mute unauthenticated guests
  bool room_auto_mute_vpn_users = 95; // ROOM_UPDATE/SETTINGS: auto-mute VPN/datacenter ASN traffic
  bool room_private = 128;            // ROOM_UPDATE/SETTINGS: private (unlisted) room

  // === Ink Thinning Fields ===
  uint32 th = 59;               // Thinning * 100 (0-100)
  uint32 sim = 60;              // Simulate pressure (0 or 1)

  // === Room Role Fields (61-62) ===
  string room_role_target_id = 61;  // Target userId for room role assignment
  uint32 room_role_value     = 62;  // Role value to assign (0-5)
  string room_role_target_name = 71; // Username for offline room role assignment

  // === Global Role Fields (72-73) ===
  string targetUsername = 72;  // Target username for global role assignment (DEITY only)
  uint32 newGlobalRole  = 73;  // New global role value (7=Noble, 8=Holy)

  // === Tile Ownership Fields ===
  message TileEntry {
    uint32 idx   = 1;           // Tile index
    repeated uint32 users = 2;  // User IDs who own this tile
  }
  repeated TileEntry tiles = 66;  // Tile ownership entries (for SYNC_TILE_OWNERSHIP and TILE_UPDATE)
  repeated uint32 clearedTiles = 67;  // Tile indices that are now empty (for TILE_CLEAR)

  // === Room Ownership Broadcast Fields (68-69) ===
  string ownerId       = 68;  // ROOM_OWNERSHIP: room owner's userId (null if unregistered)
  string ownerUsername = 69;  // ROOM_OWNERSHIP: room owner's username
  message RoomRoleEntry {
    string userId = 1;
    string username = 2;
    uint32 role = 3;
    string updatedBy = 4;
    string updatedByUsername = 5;
    uint64 updatedAt = 6;
    uint32 previousRole = 7;
    string changeType = 8;
    bool isOwner = 9;
  }
  repeated RoomRoleEntry room_roles = 70; // ROOM_ROLE_LIST_RESPONSE: room-specific moderation roster
  uint64 mod_undo_ts   = 82;  // MOD_UNDO_TO_STATE: target timestamp
  string pb            = 83;  // Pattern brush data JSON (for GPT message)
  bool   pm            = 84;  // Pattern mode enabled (for fill/select tools)
  string fo            = 85;  // Text font family
  float  tm            = 86;  // Text baseline multiplier
  float  to            = 87;  // Text baseline offset
  string sdm           = 88;  // Shape draw mode ('corner-to-corner' | 'center-scaling')
  bool   mk            = 89;  // Selection mask active flag

  // === Board Snapshot Fields (100+) ===
  bytes snapshot_data  = 100; // QOI encoded board state (legacy single-layer)
  string snapshot_id   = 101; // ID for listing/restoring
  uint64 snapshot_ts   = 102; // Timestamp
  string snapshot_issuer = 103; // Who took it

  bytes snapshot_thumb = 105; // JPEG thumbnail (1/3 scale)
  repeated bytes snapshot_layers = 106; // Per-layer QOI encoded data
  bool snapshot_restore_after_save = 107; // SAVE: server should broadcast restore after persisting
  uint64 snapshot_seq = 108; // SAVE: client's applied-seq the capture represents; SYNC_CHECKPOINT_MINTED: the checkpoint's seq watermark
  bool snapshot_pin = 207;   // SAVE: also pin this save as the room's start state
  // ROOM_START_SNAPSHOT_INFO: 0 = none (room starts blank), 1 = the room's
  // newest snapshot (default), 2 = an explicitly pinned snapshot. Tri-state
  // rather than a bool so proto3's omitted-false can't read as "unset".
  uint32 room_start_snapshot_state = 208;

  message SnapshotMeta {
    string id = 1;
    uint64 ts = 2;
    string issuer = 3;
    string name = 4;
    bool auto = 5; // Whether it was an auto-snapshot
    bytes thumb = 6; // JPEG thumbnail
  }
  repeated SnapshotMeta snapshot_list = 104;

  // === Checkpoint / Replay Fields (110+) ===
  bytes checkpoint_img = 110;        // Full board PNG for CHECKPOINT_UPLOAD
  string checkpoint_id = 111;        // Checkpoint ID (for GET/LIST)
  uint64 checkpoint_ts = 112;        // Checkpoint timestamp
  string checkpoint_uploader = 113;  // Username who uploaded
  string room_dedicated_replay_user = 114; // SETTINGS: dedicated replay uploader username
  string chat_message_id = 124;      // Shared ID for chat text/image/reaction targets
  string chat_reaction = 125;        // Emoji reaction payload
  bool chat_reaction_remove = 126;   // Whether this reaction is being removed
  string fa = 146;                   // Floating art (gallery item JSON) for FLOATING_ART_UPDATE
  uint32 room_floating_gallery_seed = 147; // ROOM_UPDATE/SETTINGS: shared floating gallery layout seed
  repeated string room_floating_gallery_include_ids = 148; // ROOM_UPDATE/SETTINGS: explicitly included gallery ids
  repeated string room_floating_gallery_exclude_ids = 149; // ROOM_UPDATE/SETTINGS: explicitly excluded gallery ids
  string room_board_size = 150; // ROOM_UPDATE/SETTINGS: board size preset (720p|1080p|1440p|big)
  string room_floating_gallery_voronoi_json = 151; // SETTINGS: precomputed floating gallery Voronoi geometry
  string room_creator_device_id = 152; // ROOM_UPDATE: local creator device id for unowned room setup
  bool room_tiled_canvas = 209; // ROOM_UPDATE/SETTINGS: opt-in tiled canvas backing store (perf experiment)
  bool room_tiled_canvas_available = 210; // SETTINGS: whether the server's tiled-canvas kill switch is on at all


  message CheckpointMeta {
    string id = 1;
    uint64 ts = 2;
    string uploader = 3;
    uint32 sizeBytes = 4;
  }
  repeated CheckpointMeta checkpoint_list = 115;

  // === Replay Fields ===
  uint64 replay_start_ts = 116;   // REPLAY_REQUEST: desired start timestamp
  uint64 replay_end_ts = 117;     // REPLAY_REQUEST: desired end timestamp
  string replay_deltas_json = 118; // REPLAY_RESPONSE: JSON-encoded array of delta actions

  // === Uploader Election Fields ===
  bool low_power_mode = 119;      // PONG: client reports low-power mode status
  string elected_uploader = 120;  // SETTINGS: server-elected checkpoint uploader username
  bool tab_hidden = 121;          // PONG: whether the sender's tab is currently hidden/backgrounded
  string client_device_id = 122;  // First-party persisted device identifier
  string client_fingerprint_id = 123; // Browser fingerprint visitor id
  string client_identity_json = 127; // Compact client-side identity summary

  // === Bandwidth Probe Fields (135+) ===
  string probe_id      = 135;  // BW_PROBE_*: unique ID for the probe run
  uint32 probe_seq     = 136;  // BW_PROBE_CHUNK: 0-based chunk index
  uint32 probe_total   = 137;  // BW_PROBE_START: total chunk count
  uint32 probe_blob_size = 138; // BW_PROBE_START: expected chunk size in bytes
  bytes  probe_data    = 139;  // BW_PROBE_CHUNK: random payload bytes
  uint32 upload_bps    = 140;  // BW_REPORT: measured bytes-per-second (rounded)

  // === Retired fields ===
  // 38        mod_ip           — obfuscated IP for the mod panel; mod_entries.ip carries it now
  // 141..145  metrics_*        — METRICS_UPDATE payload; MetricsTracker posts over HTTP instead
  reserved 38, 141, 142, 143, 144, 145;


  // === Instance ID (per-connection unique identifier) ===
  string iid = 153;                 // Instance ID: random per-connection token to detect index reuse
  string image_tool_type = 159;      // IMAGE_TOOL: imageBrush|pattern|confetti
  string image_tool_data = 160;      // IMAGE_TOOL: JSON payload containing image data/settings

  // === Vector Text Overlay Fields (164+) ===
  string text_id = 164;              // TEXT_APPLY/TEXT_REMOVE: per-record identifier
  uint32 text_lifetime_ms = 165;     // TEXT_APPLY: total ephemeral lifetime in ms
  uint32 text_fade_ms = 166;         // TEXT_APPLY: trailing fade duration in ms
  uint32 text_age_ms = 167;          // TEXT_APPLY: server-stamped age at send time, used for backfill on join
  bool   text_pixel = 168;           // TEXT_APPLY: true → rasterize as a permanent stroke, skip overlay tracking
  uint32 room_text_overlay_lifetime_ms = 169; // ROOM_UPDATE/SETTINGS: per-room ephemeral text lifetime (ms)
  // ROOM_UPDATE/SETTINGS: first joiner adopts the room's last snapshot.
  // Tri-state 0=unset 1=on 2=off — a bool cannot express "off" for a
  // default-ON setting, since proto3 drops false from the wire.
  uint32 room_snapshot_on_first_join = 201;
  string resume_key = 170;           // CONNECT/CONNECT_RESUMED: opaque per-tab key for reclaiming a sessionIndex after a brief drop
  uint64 seq = 171;                  // Global message sequence number (assigned by server)

  // === Sync Parity Fields (173+) ===
  // For SYNC_PARITY_CHECK from client: `seq` carries the client's latestSeq.
  // For SYNC_PARITY_MISMATCH from server: `seq` carries the server's latestSeq.
  uint32  parity_count        = 173;  // Client's stroke fingerprint count (CHECK)
  fixed32 parity_rolling_hash = 174;  // Client's rolling hash (CHECK)
  uint32  parity_server_count = 175;  // Server's stroke count (MISMATCH)
  uint32  parity_percent_x100 = 176;  // Prefix-match percent * 100 (MISMATCH)
  uint32  parity_chunk_size   = 177;  // Chunk granularity (MANIFEST)
  repeated fixed32 parity_chunk_hashes = 178 [packed = true]; // Per-chunk hash (MANIFEST)
  uint64  parity_base_seq     = 179;  // First seq covered by manifest (MANIFEST)
  uint32  parity_chunk_index  = 180;  // Chunk index (CHUNK_REQUEST + CHUNK)
  repeated FingerprintEntry parity_entries = 181; // Full chunk contents (CHUNK)
  repeated uint64 parity_resync_seqs = 182 [packed = true]; // Seqs to replay (RESYNC_REQUEST)
  string parity_event_id = 183; // Server-issued mismatch event id for follow-up (MISMATCH→REPORT)
  repeated FingerprintEntry parity_missing = 184; // MISMATCH_REPORT: server has, client didn't
  repeated FingerprintEntry parity_extra = 185;   // MISMATCH_REPORT: client has, server doesn't
  repeated uint64 parity_mismatched_seqs = 186 [packed = true]; // MISMATCH_REPORT: same seq, diff fp
  bool parity_report_truncated = 187; // MISMATCH_REPORT: client truncated its diff before sending
  uint64 parity_pixel_snapshot_seq = 188; // CHECK: checkpoint seq compared by pixel probe
  string parity_pixel_snapshot_id = 189;  // CHECK: checkpoint id compared by pixel probe
  repeated uint32 parity_pixel_tiles = 190 [packed = true]; // CHECK: divergent tile indices
  uint32 parity_pixel_tile_size = 191; // CHECK: board pixels per tile
  uint32 parity_pixel_mad_threshold_x100 = 192; // CHECK: MAD threshold * 100
  uint32 parity_pixel_max_mad_x100 = 193; // CHECK: max tile MAD * 100
  uint32 parity_pixel_mean_mad_x100 = 194; // CHECK: mean tile MAD * 100
  uint32 parity_pixel_tile_cols = 195; // CHECK: tile grid width
  bool snapshot_probe = 196; // BOARD_SNAPSHOT_GET/SAVE response: private checkpoint probe fetch
  string profile_badge = 197; // SET_BADGE: selected cosmetic badge id ('' clears it)
  // UNDO: seq of the stroke the sender actually undid. Without it every receiver
  // re-resolves "that user's latest LIVE stroke" against its OWN bake state, and
  // clients that have baked different prefixes undo different strokes. 0 means
  // unknown (the sender's target was still unsequenced) — receivers fall back to
  // the legacy local resolution.
  uint64 undo_target_seq = 200;
  // SEL_LIFT: drawer's extendedWarp toggle for this selection session. Folded
  // (concave/crossed) corner quads normally clip their warp at the corner
  // bbox; this lets the warp spill past the selection bounds instead. Must
  // travel with the lift (not read from local per-viewer state) so every
  // client rasterizes the same commit pixels for this selection.
  bool sel_extended_warp = 202;

  // === History Backfill Fields (203+) ===
  // One archived frame: the original wire bytes, plus when and where it sat in
  // the room's timeline so the client can rebuild a scrubbable tape from it.
  message HistoryFrame {
    uint64 ts   = 1;  // Wall-clock ms of the commit this frame belongs to
    uint64 seq  = 2;  // Server seq of that commit (preamble frames share it)
    bytes  data = 3;  // Original encoded message bytes, replayed as-is
  }
  repeated HistoryFrame history_frames = 203; // HISTORY_BACKFILL_CHUNK: batch of frames, ascending
  uint32 history_total = 204;      // BEGIN/END: total frames in this backfill
  uint32 history_window_ms = 205;  // BEGIN: span the server is able to serve
  bool history_blank_base = 206;   // BEGIN: base is an empty board, no image follows
  // BEGIN also reuses the existing snapshot_* fields for the base checkpoint
  // image (snapshot_layers / snapshot_id / snapshot_ts / snapshot_seq), exactly
  // as BOARD_SNAPSHOT_RESTORE does — same payload, different destination.

  message FingerprintEntry {
    uint64  seq         = 1;
    uint32  t           = 2;          // Message type from T enum
    uint32  user_id     = 3;
    uint64  timestamp   = 4;
    fixed32 fingerprint = 5;
    string  kind        = 6;          // e.g. 'stroke.mu', 'history.undo'
  }
}

// Legacy-read-only: server-persisted checkpoints (room_snapshots + R2) now
// write `.ddraw` (shared/ddrawCodec.js) instead of this protobuf format —
// see docs/ddraw_server_snapshots_plan.md. Kept only so server/r2.js can
// still decode `.bundle` objects already sitting in R2 (dispatched by the
// room_snapshots doc's `format` field) until they roll off via the existing
// MAX_SNAPSHOTS_PER_ROOM prune. Do not write new data in this format.
message SnapshotBundle {
  repeated bytes layers = 1; // QOI encoded layers
  bytes thumbnail = 2;       // JPEG encoded thumbnail
}
